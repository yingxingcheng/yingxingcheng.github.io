name: Website checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.0.265 black==23.9.1
      - name: Lint and format
        run: |
          ruff check .
          black --check .
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Test Pages publication recovery logic
        run: node tests/check_pages_workflow.cjs
      - name: Verify checked-in pages match their source
        run: |
          python generate_html.py
          git diff --exit-code -- index.html index-zh.html
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check responsive layouts in Chromium
        run: python tests/check_layout.py
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: .layout-checks/
          if-no-files-found: ignore
